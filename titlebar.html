<!doctype html>
<html lang="en" data-theme="dark" data-focused="1">
  <head>
    <meta charset="utf-8" />
    <title>Kaneo</title>
    <style>
      /* Geist, the typeface Kaneo itself uses, bundled locally. */
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url("./fonts/geist-latin.woff2") format("woff2-variations");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url("./fonts/geist-latin-ext.woff2") format("woff2-variations");
        unicode-range: U+100-2BA, U+2BD-2C5, U+2C7-2CC, U+2CE-2D7, U+2DD-2FF,
          U+304, U+308, U+329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

      /* Palette mirrors Kaneo's own tokens (dark default, light on toggle). */
      :root {
        --bar-h: 40px;
        --bar-bg: #141414;
        --bar-line: rgba(255, 255, 255, 0.06);
        --bar-fg: #f5f5f5;
        --bar-muted: #8f8f8f;
        --bar-hover: rgba(255, 255, 255, 0.06);
        --bar-active: rgba(255, 255, 255, 0.11);
        --bar-warn: #d9a33a;
        --bar-close-bg: #fb414a;
        --bar-close-fg: #ffffff;
        --ease: cubic-bezier(0.23, 1, 0.32, 1);
      }
      html[data-theme="light"] {
        --bar-bg: #ffffff;
        --bar-line: rgba(0, 0, 0, 0.09);
        --bar-fg: #262626;
        --bar-muted: #6f6f6f;
        --bar-hover: rgba(0, 0, 0, 0.05);
        --bar-active: rgba(0, 0, 0, 0.09);
        --bar-warn: #b26a00;
        --bar-close-bg: #e5484d;
        --bar-close-fg: #ffffff;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: var(--bar-h);
        margin: 0;
        overflow: hidden;
      }
      body {
        font-family: "Geist", "Segoe UI Variable Text", "Segoe UI", system-ui,
          sans-serif;
        background: var(--bar-bg);
        color: var(--bar-fg);
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
      }

      .bar {
        height: var(--bar-h);
        display: flex;
        align-items: stretch;
        border-bottom: 1px solid var(--bar-line);
        -webkit-app-region: drag;
      }

      .identity {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 13px;
        min-width: 0;
      }
      .mark {
        width: 15px;
        height: 15px;
        color: var(--bar-fg);
        flex: none;
      }
      .wordmark {
        font-size: 12.5px;
        font-weight: 560;
        letter-spacing: -0.006em;
        line-height: 1;
        white-space: nowrap;
      }

      /* Quiet connection state, shown only when the backend isn't answering. */
      .status {
        display: none;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 450;
        color: var(--bar-muted);
      }
      .status[data-on="1"] {
        display: flex;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--bar-warn);
      }
      .status[data-state="loading"] .dot,
      .status[data-state="updating"] .dot {
        background: var(--bar-muted);
        animation: pulse 1.6s var(--ease) infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 1;
        }
      }

      .spacer {
        flex: 1 1 auto;
      }

      .actions,
      .controls {
        display: flex;
        align-items: stretch;
        -webkit-app-region: no-drag;
      }
      .actions {
        padding-right: 2px;
      }
      .ctl {
        width: 46px;
        height: var(--bar-h);
        display: grid;
        place-items: center;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--bar-fg);
        cursor: default;
        transition: background-color 120ms var(--ease), color 120ms var(--ease);
      }
      .ctl:hover {
        background: var(--bar-hover);
      }
      .ctl:active {
        background: var(--bar-active);
      }
      .ctl:focus-visible {
        outline: 2px solid var(--bar-fg);
        outline-offset: -3px;
      }
      .ctl.close:hover,
      .ctl.close:active {
        background: var(--bar-close-bg);
        color: var(--bar-close-fg);
      }
      .glyph {
        width: 10px;
        height: 10px;
        display: block;
      }

      /* An unfocused window reads a touch quieter, like native chrome. */
      html[data-focused="0"] .identity {
        opacity: 0.55;
      }
      html[data-focused="0"] .bar {
        border-bottom-color: transparent;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="identity">
        <svg class="mark" viewBox="22 22 92 92" aria-hidden="true">
          <path
            fill="currentColor"
            d="M62.6855 103.724C58.5716 104.595 56.0001 103.265 56 101.66L56 70.0264C56 69.8606 56.0032 69.686 56.0088 69.5069C56.0039 69.3848 56.001 69.249 56.001 69.0977L56.001 37.9444C56.015 36.6524 56.2588 35.7449 59.2588 35.1094L73.3145 32.2764C77.4285 31.405 80 32.7365 80 34.3408L80 65.9746C80 66.1409 79.9978 66.3155 79.9922 66.4951C79.997 66.6169 79.999 66.7526 79.999 66.9033L79.999 98.0567C79.9849 99.3483 79.7408 100.256 76.7412 100.892L62.6855 103.724Z"
          />
          <path
            fill="currentColor"
            d="M30.6855 111.723C26.5716 112.594 24.0001 111.264 24 109.659L24 78.0244C24 77.8588 24.0032 77.6848 24.0088 77.5059C24.0039 77.3838 24.001 77.248 24.001 77.0967L24.001 45.9434C24.015 44.6514 24.2588 43.7439 27.2588 43.1084L41.3145 40.2754C45.4285 39.404 48 40.7355 48 42.3399L48 73.9737C48 74.1399 47.9978 74.3146 47.9922 74.4942C47.997 74.6159 47.999 74.7517 47.999 74.9024L47.999 106.056C47.9849 107.347 47.7408 108.255 44.7412 108.891L30.6855 111.723Z"
          />
          <path
            fill="currentColor"
            d="M105.314 24.2754C109.428 23.404 112 24.7355 112 26.3398V37.1845L94.0576 60.5019L111.999 82.7802V90.0576C111.985 91.3492 111.741 92.2571 108.741 92.8925L94.6855 95.7246C90.5717 96.596 88.0002 95.2654 88 93.6611V62.0254C88 61.8598 88.0032 61.6856 88.0088 61.5068C88.0039 61.3848 88.001 61.2488 88.001 61.0976V29.9433C88.0151 28.6516 88.2591 27.7438 91.2588 27.1084L105.314 24.2754Z"
          />
        </svg>
        <span class="wordmark">Kaneo</span>
        <span class="status" id="status" data-on="0" data-state="loading">
          <span class="dot"></span>
          <span id="statusText">Connecting…</span>
        </span>
      </div>

      <div class="spacer"></div>

      <div class="actions">
        <button class="ctl" id="menu" aria-label="Menu" title="Menu">
          <svg class="glyph" viewBox="0 0 10 10" aria-hidden="true">
            <circle cx="1.5" cy="5" r="1" fill="currentColor" />
            <circle cx="5" cy="5" r="1" fill="currentColor" />
            <circle cx="8.5" cy="5" r="1" fill="currentColor" />
          </svg>
        </button>
      </div>

      <div class="controls">
        <button class="ctl" id="min" aria-label="Minimize" title="Minimize">
          <svg class="glyph" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M0 5h10" stroke="currentColor" stroke-width="1" />
          </svg>
        </button>
        <button class="ctl" id="max" aria-label="Maximize" title="Maximize">
          <svg class="glyph" id="maxGlyph" viewBox="0 0 10 10" aria-hidden="true">
            <rect
              x="0.5"
              y="0.5"
              width="9"
              height="9"
              fill="none"
              stroke="currentColor"
              stroke-width="1"
            />
          </svg>
        </button>
        <button class="ctl close" id="close" aria-label="Close" title="Close">
          <svg class="glyph" viewBox="0 0 10 10" aria-hidden="true">
            <path
              d="M0 0l10 10M10 0L0 10"
              stroke="currentColor"
              stroke-width="1"
            />
          </svg>
        </button>
      </div>
    </div>

    <script>
      const api = window.kaneoWindow;
      const root = document.documentElement;
      const statusEl = document.getElementById("status");
      const statusText = document.getElementById("statusText");
      const maxBtn = document.getElementById("max");
      const maxGlyph = document.getElementById("maxGlyph");

      const GLYPH_MAX =
        '<rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/>';
      const GLYPH_RESTORE =
        '<path d="M2.5 2.5h7v7" fill="none" stroke="currentColor" stroke-width="1"/><rect x="0.5" y="0.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/>';

      let maximized = false;
      function renderMax() {
        maxGlyph.innerHTML = maximized ? GLYPH_RESTORE : GLYPH_MAX;
        const label = maximized ? "Restore" : "Maximize";
        maxBtn.setAttribute("aria-label", label);
        maxBtn.setAttribute("title", label);
      }

      document.getElementById("min").addEventListener("click", () => api && api.minimize());
      maxBtn.addEventListener("click", () => api && api.toggleMaximize());
      document.getElementById("close").addEventListener("click", () => api && api.close());

      if (api) {
        api.onTheme((t) => {
          if (t) root.dataset.theme = t;
        });
        api.onMaximized((v) => {
          maximized = !!v;
          renderMax();
        });
        api.onFocused((v) => {
          root.dataset.focused = v ? "1" : "0";
        });
        api.onStatus((s) => {
          if (s === "ready") {
            statusEl.dataset.on = "0";
            return;
          }
          statusEl.dataset.on = "1";
          statusEl.dataset.state = s;
          statusText.textContent =
            s === "offline" ? "Offline" : s === "updating" ? "Updating…" : "Connecting…";
        });
      }

      document.getElementById("menu").addEventListener("click", () => api && api.menu());
      window.addEventListener("contextmenu", (event) => {
        event.preventDefault();
        if (api) api.menu();
      });

      renderMax();
    </script>
  </body>
</html>
